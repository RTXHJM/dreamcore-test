<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梦核人格测试 · 42题 · 17型</title>
<style>
  /* ============================================================
     梦核主题 · 冷紫主色 / 冷蓝次色 / 浅粉点缀
     ============================================================ */
  :root{
    /* —— 背景层次：深紫夜空 —— */
    --bg1:#07051a;          /* 最深：夜紫黑 */
    --bg2:#0e0a2e;          /* 中间：深紫蓝 */
    --bg3:#171036;          /* 最浅：暗紫 */

    /* —— 文字 —— */
    --ink:#ece9ff;          /* 主文字：冷白紫 */
    --sub:#9c97c9;          /* 次要文字：雾紫灰 */
    --line:rgba(196,180,255,.14); /* 冷紫描边 */

    /* —— 强调色 —— */
    --glow:#a78bfa;         /* 主色：冷紫（薰衣草紫） */
    --glow2:#7fb6ff;        /* 次色：冷蓝 */
    --pink:#ffb8d9;         /* 点缀：浅粉（仅少量） */
    --rose:#ff8fc7;         /* 粉色深一点，做渐变收尾 */

    /* —— 卡片 / 圆角 —— */
    --card:rgba(24,18,58,.55);
    --radius:22px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      /* 左下角加一个冷蓝光斑，弥补大屏下半部分的空旷 */
      radial-gradient(900px 600px at 10% 110%, rgba(127,182,255,.18), transparent 60%),
      /* 原来的左上冷紫 */
      radial-gradient(1100px 760px at 12% -12%, rgba(167,139,250,.42), transparent 60%),
      /* 原来的右上冷蓝 */
      radial-gradient(1000px 700px at 108% 8%, rgba(127,182,255,.30), transparent 58%),
      /* 右下浅粉点缀 */
      radial-gradient(820px 820px at 88% 118%, rgba(255,184,217,.20), transparent 62%),
      /* 底部渐变改成更深更平滑的过渡 */
      linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 60%, #0a0620 100%);
    min-height:100vh;
    display:block;
    padding:40px 16px;
    overflow-x:hidden;
    background-attachment: fixed; /* 新增：让背景固定，滑动时背景不动，更沉浸 */
  }

  /* —— 星尘：冷紫/冷蓝细点 —— */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      radial-gradient(1.4px 1.4px at 20% 30%, rgba(200,190,255,.8), transparent),
      radial-gradient(1.2px 1.2px at 70% 15%, rgba(150,200,255,.7), transparent),
      radial-gradient(1.6px 1.6px at 85% 60%, rgba(255,190,225,.6), transparent),
      radial-gradient(1.2px 1.2px at 35% 80%, rgba(180,170,255,.6), transparent),
      radial-gradient(1.6px 1.6px at 55% 45%, rgba(160,210,255,.6), transparent),
      radial-gradient(1px 1px at 10% 65%, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 92% 35%, rgba(220,210,255,.7), transparent);
    background-repeat:no-repeat;
    animation:twinkle 7s ease-in-out infinite alternate;
  }
  @keyframes twinkle{from{opacity:.45}to{opacity:.95}}

  .app{
    position:relative;z-index:1;
    width:100%;max-width:720px;
    margin:0 auto;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    backdrop-filter:blur(20px) saturate(130%);
    -webkit-backdrop-filter:blur(20px) saturate(130%);
    box-shadow:
      0 34px 90px rgba(10,5,40,.75),
      0 0 0 1px rgba(167,139,250,.06) inset,
      0 1px 0 rgba(255,255,255,.08) inset;
    padding:34px 30px 30px;
    overflow:hidden;
  }
  /* 卡片顶部一道冷紫→冷蓝的细光边 */
  .app::before{
    content:"";position:absolute;top:0;left:12%;right:12%;height:1px;
    background:linear-gradient(90deg,transparent,var(--glow),var(--glow2),transparent);
    opacity:.7;
  }
  @media(max-width:520px){ .app{padding:24px 18px} }

  .screen{display:none;animation:fade .5s ease both}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  /* ============ 开始页 ============ */
  .hero{text-align:center;padding:20px 0 8px}
  .hero .eyebrow{
    display:inline-block;font-size:12px;letter-spacing:.24em;
    color:var(--glow2);
    border:1px solid rgba(127,182,255,.35);
    background:rgba(127,182,255,.07);
    padding:6px 14px;border-radius:999px;margin-bottom:22px;
  }
  .hero h1{
    font-size:clamp(28px,5vw,40px);line-height:1.25;font-weight:800;
    background:linear-gradient(120deg,#fff 0%,var(--glow) 42%,var(--glow2) 70%,var(--pink) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    letter-spacing:.02em;
    filter:drop-shadow(0 4px 24px rgba(167,139,250,.35));
  }
  .hero p.sub{color:var(--sub);margin-top:14px;font-size:15px;line-height:1.8}
  .meta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0 26px}
  .meta span{
    font-size:12.5px;color:var(--sub);
    border:1px solid var(--line);padding:6px 12px;border-radius:999px;
    background:rgba(167,139,250,.05);
  }

  /* ============ 按钮 ============ */
  .btn{
    appearance:none;border:none;cursor:pointer;font:inherit;
    padding:15px 30px;border-radius:14px;font-weight:700;font-size:16px;
    color:#0a0720;
    background:linear-gradient(120deg,var(--glow2),var(--glow) 52%,var(--pink));
    box-shadow:0 14px 38px rgba(127,120,255,.45), 0 0 0 1px rgba(255,255,255,.08) inset;
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 20px 50px rgba(140,120,255,.6);filter:brightness(1.07)}
  .btn:active{transform:translateY(0)}
  .btn.ghost{
    background:rgba(167,139,250,.06);color:var(--ink);
    border:1px solid var(--line);box-shadow:none;
  }
  .btn.ghost:hover{border-color:rgba(167,139,250,.5);background:rgba(167,139,250,.12)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;filter:none}
  .foot-note{color:var(--sub);font-size:12.5px;text-align:center;margin-top:18px;line-height:1.7}

  /* ============ 答题页 ============ */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:8px}
  .dim-tag{font-size:12.5px;color:var(--glow2);letter-spacing:.06em}
  .counter{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
  .progress-wrap{margin:14px 0 26px}
  .progress-bar{height:8px;border-radius:999px;background:rgba(167,139,250,.10);overflow:hidden;border:1px solid var(--line)}
  .progress-fill{
    height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,var(--glow2),var(--glow) 55%,var(--pink));
    transition:width .35s cubic-bezier(.4,0,.2,1);
    box-shadow:0 0 20px rgba(167,139,250,.7);
  }
  .q-title{font-size:clamp(18px,3vw,22px);font-weight:700;line-height:1.6;margin-bottom:22px;min-height:2.2em}
  .options{display:flex;flex-direction:column;gap:12px}
  .option{
    text-align:left;width:100%;cursor:pointer;font:inherit;color:var(--ink);
    background:rgba(167,139,250,.05);
    border:1px solid var(--line);
    border-radius:16px;padding:16px 18px;
    display:flex;align-items:center;gap:14px;
    transition:all .18s ease;
    -webkit-tap-highlight-color: transparent; /* 隱藏手機端自帶的點擊高光 */
    outline: none; /* 隱藏點擊後的聚焦框 */
    -webkit-appearance: none;
    appearance: none;
    font: inherit;
    color: var(--ink);
  }
  .option .key{
    flex:0 0 30px;height:30px;border-radius:9px;
    display:grid;place-items:center;font-weight:800;font-size:13px;
    background:rgba(127,182,255,.12);border:1px solid rgba(127,182,255,.25);
    color:var(--glow2);transition:all .18s ease;
  }

 /* 👇 hover 只在真正有鼠标的设备生效，手机触摸不会“粘住” */
  @media (hover: hover) and (pointer: fine){
    .option:hover{
      background:rgba(167,139,250,.13);
      border-color:rgba(167,139,250,.6);
      transform:translateX(3px);
      box-shadow:0 8px 26px rgba(80,60,180,.25);
    }
    .option:hover .key{
      background:linear-gradient(120deg,var(--glow2),var(--glow));
      color:#0a0720;border-color:transparent;
    }
  }

  /* 👇 selected 单独保留，不受 hover 媒体查询影响 */
  .option.selected{
    border-color:var(--glow);
    background:linear-gradient(120deg,rgba(167,139,250,.20),rgba(127,182,255,.12));
    box-shadow:0 0 0 1px rgba(167,139,250,.4), 0 10px 30px rgba(100,80,220,.25);
  }
  .option.selected .key{
    background:linear-gradient(120deg,var(--glow2),var(--glow));
    color:#0a0720;border-color:transparent;
  }
  .option .txt{flex:1;font-size:15.5px;line-height:1.55}
  .nav-row{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
  .nav-row .btn{padding:12px 22px;font-size:14px}
  .hint{color:var(--sub);font-size:12px;text-align:center;margin-top:14px}

  /* ============ 结果页 ============ */
  .result-head{text-align:center;margin-bottom:26px}
  .badge{
    display:inline-block;font-size:12px;letter-spacing:.2em;color:var(--glow2);
    border:1px solid rgba(127,182,255,.4);padding:5px 14px;border-radius:999px;margin-bottom:14px;
    background:rgba(127,182,255,.08);
  }
  .result-head h2{
    font-size:clamp(26px,5vw,36px);font-weight:800;line-height:1.25;
    background:linear-gradient(120deg,#fff,var(--glow) 48%,var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 22px rgba(167,139,250,.35));
  }
  .result-head .code{
    display:inline-block;margin-top:10px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    color:var(--sub);letter-spacing:.35em;font-size:13px;
  }
  .match-pill{
    display:inline-flex;align-items:center;gap:8px;margin-top:14px;
    padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;
    color:#0a0720;
    background:linear-gradient(120deg,var(--glow2),var(--glow));
    box-shadow:0 8px 24px rgba(127,120,255,.4);
  }
  .section-label{
    font-size:12px;letter-spacing:.22em;color:var(--sub);
    margin:30px 0 14px;display:flex;align-items:center;gap:12px;
  }
  .section-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  .desc-box{
    background:linear-gradient(150deg,rgba(167,139,250,.08),rgba(127,182,255,.05));
    border:1px solid var(--line);
    border-radius:16px;padding:20px 22px;line-height:1.9;color:#dcd8ff;font-size:15.5px;
  }

  .dims{display:flex;flex-direction:column;gap:14px}
  .dim-row{background:rgba(167,139,250,.04);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .dim-row .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px;flex-wrap:wrap}
  .dim-row .name{font-size:13px;color:var(--sub);letter-spacing:.04em}
  .dim-row .val{font-size:14px;font-weight:700}
  .dim-row .val em{font-style:normal;color:var(--pink)}
  .track{height:7px;border-radius:999px;background:rgba(167,139,250,.10);overflow:hidden;border:1px solid var(--line)}
  .track > i{
    display:block;height:100%;border-radius:999px;
    background:linear-gradient(90deg,var(--glow2),var(--glow) 60%,var(--pink));
    transition:width .8s cubic-bezier(.4,0,.2,1);
    box-shadow:0 0 14px rgba(167,139,250,.6);
  }

  .second-card{
    background:linear-gradient(160deg,rgba(127,182,255,.07),rgba(167,139,250,.04));
    border:1px solid var(--line);border-radius:16px;padding:18px 20px;
  }
  .second-card .ttl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .second-card .ttl b{font-size:16px;color:var(--ink)}
  .second-card .ttl span{font-size:12.5px;color:var(--glow2);font-weight:700}
  .second-card p{font-size:14px;line-height:1.8;color:#c9c4ec}

  .actions{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
  .actions .btn{flex:1;min-width:150px;text-align:center;padding:14px 18px;font-size:14.5px}
  .copy-tip{text-align:center;color:var(--pink);font-size:13px;margin-top:12px;height:18px;transition:opacity .3s}

  /* ============ 图鉴入口 ============ */
  .codex-entry{margin-top:26px;text-align:center}
  .codex-entry .btn{width:100%;padding:14px 18px;font-size:14.5px}

  /* ============ 图鉴弹层 ============ */
  .codex-overlay{
    position:fixed;inset:0;z-index:50;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    background:rgba(6,3,22,.72);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    opacity:0;pointer-events:none;
    transition:opacity .3s ease;
  }
  .codex-overlay.open{opacity:1;pointer-events:auto}

  .codex-panel{
    width:100%;max-width:720px;
    max-height:90vh;
    display:flex;flex-direction:column;
    background:
      linear-gradient(150deg,rgba(167,139,250,.10),rgba(127,182,255,.06)),
      rgba(18,13,46,.96);
    border:1px solid rgba(196,180,255,.18);
    border-radius:22px;
    box-shadow:0 40px 100px rgba(0,0,0,.7);
    transform:translateY(18px) scale(.98);
    transition:transform .32s cubic-bezier(.4,0,.2,1);
    overflow:hidden;
  }
  .codex-overlay.open .codex-panel{transform:none}

  .codex-head{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:16px 18px 12px;
    border-bottom:1px solid rgba(196,180,255,.14);
    background:linear-gradient(180deg,rgba(167,139,250,.10),transparent);
  }
  .codex-eyebrow{
    font-size:11px;letter-spacing:.24em;color:var(--glow2);
    margin-bottom:6px;
  }
  .codex-head h3{
    font-size:20px;font-weight:800;
    background:linear-gradient(120deg,#fff,var(--glow) 60%,var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .codex-close{
    flex:0 0 38px;height:38px;border-radius:50%;
    border:1px solid rgba(196,180,255,.2);
    background:rgba(167,139,250,.08);
    color:var(--ink);font-size:15px;cursor:pointer;
    display:grid;place-items:center;
    transition:all .18s ease;
  }
  .codex-close:hover{background:rgba(255,143,199,.18);border-color:var(--pink);color:var(--pink)}

  .codex-body{
    padding:16px;
    overflow-y:auto;
    display:grid;
    grid-template-columns: repeat(2, 1fr); /* 强制两列 */
    gap:12px; /* 间距缩小，给图片留出更多空间 */
  }
  @media(min-width:640px){
    .codex-body{grid-template-columns:1fr 1fr}
  }

  .codex-card{
    position:relative;
    background:rgba(167,139,250,.05);
    border:1px solid rgba(196,180,255,.14);
    border-radius:12px;
    padding:8px;
    transition:all .2s ease;
  }
  .codex-card:hover{
    border-color:rgba(167,139,250,.5);
    background:rgba(167,139,250,.1);
    transform:translateY(-2px);
  }
  .codex-card.is-current{
    border-color:var(--glow);
    background:linear-gradient(140deg,rgba(167,139,250,.22),rgba(127,182,255,.12));
    box-shadow:0 0 0 1px rgba(167,139,250,.5), 0 14px 40px rgba(100,80,220,.35);
  }

  .codex-card-top{display:flex;align-items:center;gap:3px;margin-bottom:6px;min-height: 28px;}
  .codex-index{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:8px;font-weight:700;color:var(--glow2);
    opacity:.8;flex-shrink: 0;         /* 绝对不让序号被挤压变形 */
  }
  .codex-card h4{
    font-size:10px;font-weight:800;line-height:1.3;flex-grow: 1;min-width: 0;
    /* 核心修改：允许换行，但最多显示2行 */
    white-space: normal; /* 允许自然换行 */
    display: -webkit-box;
    -webkit-line-clamp: 2; /* 限制最多2行 */
    -webkit-box-orient: vertical;
    overflow: hidden;
    color:var(--ink);
  }
  .codex-you{
    position: absolute; /* 绝对定位 */
    top: 6px;           /* 靠上 */
    right: 6px;         /* 靠右 */
    z-index: 10;        /* 保证浮在图片上面 */
  
    font-size: 10px;    /* 字号小一点 */
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 999px;
    color: #0a0720;
    background: linear-gradient(120deg, var(--glow2), var(--pink));
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .codex-code{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:8px;letter-spacing:.3em;
    color:var(--pink);margin-bottom:4px;
  }
  .codex-dims{
    font-size:8px;color:var(--glow2);
    line-height:1.7;margin-bottom:6px;
    display: -webkit-box;
    -webkit-line-clamp: 2; /* 最多显示2行维度，防撑破 */
    -webkit-box-orient: vertical;
    overflow: hidden;
    opacity:.92;
  }
  .codex-desc{
    font-size:8px;line-height:1.5;color:#c9c4ec;
    display: -webkit-box;
    -webkit-line-clamp: 4; /* 简介最多4行，如果嫌长可以改小 */
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .codex-avatar{
    display:block;width:100%;aspect-ratio:3/4;object-fit:cover;
    border-radius:8px;margin-bottom:8px;
    border:1px solid rgba(196,180,255,.18);
    background:rgba(167,139,250,.06);
  }
  .codex-card.is-current .codex-avatar{
    border-color:var(--glow);
    box-shadow:0 0 0 1px var(--glow), 0 10px 30px rgba(100,80,220,.35);
  }

  .result-avatar{
    display:block;width:min(200px,50%);aspect-ratio:3/4;max-height:300px;object-fit:cover;
    margin:0 auto 18px;border-radius:20px;
    border:1px solid rgba(196,180,255,.2);
    box-shadow:0 18px 50px rgba(80,60,180,.4);
  }

  /* 終極防幽靈預選覆蓋 */
  .option:focus:not(:focus-visible) {
    outline: none !important;
    background: rgba(167,139,250,.05) !important;
    border-color: var(--line) !important;
    transform: none !important;
    box-shadow: none !important;
  }
  .option:focus:not(:focus-visible) .key {
    background: rgba(127,182,255,.12) !important;
    color: var(--glow2) !important;
    border-color: rgba(127,182,255,.25) !important;
  }
  
  /* 保留我們手動加上 selected 類時的樣式，優先級最高 */
  .option.selected, 
  .option.selected:focus {
    border-color: var(--glow) !important;
    background: linear-gradient(120deg,rgba(167,139,250,.20),rgba(127,182,255,.12)) !important;
    box-shadow: 0 0 0 1px rgba(167,139,250,.4), 0 10px 30px rgba(100,80,220,.25) !important;
  }

  .option.selected .key,
  .option.selected:focus .key {
    background: linear-gradient(120deg,var(--glow2),var(--glow)) !important;
    color: #0a0720 !important;
    border-color: transparent !important;
  }

</style>
</head>
<body>
<div class="app">

  <section id="screen-start" class="screen active">
    <div class="hero">
      <div class="eyebrow">DREAMCORE · PERSONALITY</div>
      <h1>梦核人格图鉴</h1>
      <p class="sub">42 道题 · 6 个维度 · 17 种人格<br>在超现实的镜像里，照见你入世的方式。</p>
      <div class="meta"><span>约 6 分钟</span><span>42 题</span><span>17 型结果</span></div>
      <button class="btn" id="btn-start" type="button">开始测试</button>
      <p class="foot-note">请凭第一直觉作答，没有对错之分。</p>
    </div>
  </section>

  <section id="screen-quiz" class="screen">
    <div class="topbar">
      <span class="dim-tag" id="dim-tag">维度</span>
      <span class="counter" id="counter">1 / 42</span>
    </div>
    <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div></div>
    <h2 class="q-title" id="q-title"></h2>
    <div class="options" id="options"></div>

/* ==================== 计分与判定 ==================== */
const state = {
  answers: new Array(QUESTIONS.length).fill(null), // 每题选中的选项索引 0/1/2
  index: 0,
};

function scoreToTier(score){
  if(score <= 11) return 1;
  if(score <= 16) return 2;
  return 3;
}

function computeDimScores(answers){
  const dimScores = [];
  for(let d=0; d<6; d++){
    let total = 0;
    for(let q=0; q<7; q++){
      const idx = d*7 + q;
      const sel = answers[idx];
      total += QUESTIONS[idx].opts[sel].s;
    }
    dimScores.push(total);
  }
  return dimScores;
}

function getCode(dimScores){
  return dimScores.map(scoreToTier);
}

function hamming(a, b){
  let n = 0;
  for(let i=0;i<6;i++) if(a[i] !== b[i]) n++;
  return n;
}

/**
 * 匹配 17 型。
 * 排序键：汉明距离 → 深渊(第6维)距离 → 回声(第5维)距离 → 时间(第4维)距离
 */
function matchPersonality(code){
  const scored = PERSONALITIES.map(p => {
    const pc = p.code.split("").map(Number);
    return {
      p,
      ham: hamming(code, pc),
      abyss: Math.abs(code[5] - pc[5]),
      echo:  Math.abs(code[4] - pc[4]),
      time:  Math.abs(code[3] - pc[3]),
    };
  });
  scored.sort((a,b) =>
    a.ham - b.ham ||
    a.abyss - b.abyss ||
    a.echo - b.echo ||
    a.time - b.time
  );
  const best = scored[0];
  const second = scored[1] || scored[0];
  const pct = Math.round((1 - best.ham/6) * 100);
  const pct2 = Math.round((1 - second.ham/6) * 100);
  return { best, second, pct, pct2 };
}

/* ==================== 页面切换 ==================== */
const screens = {
  start:  document.getElementById("screen-start"),
  quiz:   document.getElementById("screen-quiz"),
  result: document.getElementById("screen-result"),
};
function showScreen(name){
  Object.values(screens).forEach(s => s.classList.remove("active"));
  screens[name].classList.add("active");
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ==================== 答题页渲染 ==================== */
const elDimTag   = document.getElementById("dim-tag");
const elCounter  = document.getElementById("counter");
const elProgress = document.getElementById("progress-fill");
const elQTitle   = document.getElementById("q-title");
const elOptions  = document.getElementById("options");
const elPrev     = document.getElementById("btn-prev");
const elNext     = document.getElementById("btn-next");

const LETTERS = ["A","B","C"];

function renderQuestion(){
  const i = state.index;
  const q = QUESTIONS[i];
  const dimIdx = Math.floor(i / 7);

  // ① 渲染前：先把旧选项的焦点清掉
  if (document.activeElement && elOptions.contains(document.activeElement)) {
    document.activeElement.blur();
  }
  elOptions.innerHTML = "";

  elDimTag.textContent = `维度 ${dimIdx+1}/6 · ${DIMENSIONS[dimIdx]}`;
  elCounter.textContent = `${i+1} / ${QUESTIONS.length}`;
  elProgress.style.width = `${((i) / QUESTIONS.length) * 100}%`;
  elQTitle.textContent = q.q;

  q.opts.forEach((opt, oi) => {
    const btn = document.createElement("div");
    btn.className = "option";
    btn.setAttribute("role", "button");
    btn.tabIndex = -1;
    btn.style.touchAction = "manipulation";
    btn.style.cursor = "pointer";

    // ② 恢复当前题已选答案（返回上一题时用）
    if (state.answers[i] === oi) {
      btn.classList.add("selected");
    }

    btn.innerHTML = `<span class="key">${LETTERS[oi]}</span><span class="txt"></span>`;
    btn.querySelector(".txt").textContent = opt.t;
    btn.addEventListener("click", () => selectOption(oi));
    elOptions.appendChild(btn);
  });

  elPrev.disabled = (i === 0);
  updateNextButton();

  // ③ 渲染后下一帧：再清一次焦点，并强制移除非当前答案的 selected/内联样式
  requestAnimationFrame(() => {
    if (document.activeElement && document.activeElement.blur) {
      document.activeElement.blur();
    }
    elOptions.querySelectorAll(".option").forEach((b, idx) => {
      b.blur();
      if (state.answers[i] !== idx) {
        b.classList.remove("selected");
        b.style.background = "";
        b.style.borderColor = "";
        b.style.boxShadow = "";
      }
    });
  });
}

function updateNextButton(){
  const i = state.index;
  const answered = state.answers[i] !== null;
  const isLast = (i === QUESTIONS.length - 1);
  elNext.disabled = !answered;
  elNext.textContent = isLast ? "查看结果" : "下一题";
}

let locking = false;

function selectOption(oi){
  if (locking) return;
  locking = true;

  state.answers[state.index] = oi;

  const allBtns = elOptions.querySelectorAll('.option');
  allBtns.forEach((btn, idx) => {
    btn.classList.remove("selected");
    if (idx === oi) {
      btn.classList.add("selected");
      btn.blur();
    }
  });

  updateNextButton();

  if (state.index < QUESTIONS.length - 1) {
    setTimeout(() => {
      // 跳转前再清一次焦点，防止焦点被带到下一题同索引
      if (document.activeElement && document.activeElement.blur) {
        document.activeElement.blur();
      }
      elOptions.querySelectorAll('.option').forEach(b => b.blur());
      goNext();
      locking = false;
    }, 250);
  } else {
    locking = false;
  }
}

function goPrev(){
  if(state.index > 0){
    state.index--;
    renderQuestion();
  }
}

function goNext(){
  if (state.answers[state.index] === null) return;

  if (state.index < QUESTIONS.length - 1) {
    state.index++;
    renderQuestion();
    // renderQuestion 里已经做了下一帧清焦点，这里不用再 blur
  } else {
    finish();
  }
}

/* ==================== 结果渲染 ==================== */
const elRName       = document.getElementById("r-name");
const elRCode       = document.getElementById("r-code");
const elRMatch      = document.getElementById("r-match");
const elRDesc       = document.getElementById("r-desc");
const elRDims       = document.getElementById("r-dims");
const elRSecondName = document.getElementById("r-second-name");
const elRSecondMatch= document.getElementById("r-second-match");
const elRSecondDesc = document.getElementById("r-second-desc");
const elCopyTip     = document.getElementById("copy-tip");

let lastResult = null; // 供分享用

function finish(){
  const dimScores = computeDimScores(state.answers);
  const code = getCode(dimScores);
  const { best, second, pct, pct2 } = matchPersonality(code);

  lastResult = { dimScores, code, best, second, pct, pct2 };

  elRName.textContent = best.p.name;
  document.getElementById("r-avatar").src = `Dreamcore Personality Test/${best.p.code}.png`;
  document.getElementById("r-avatar").alt = best.p.name;
  elRCode.textContent = best.p.code;
  elRMatch.textContent = `匹配度 ${pct}%`;
  elRDesc.textContent = best.p.desc;

  // 六维画像
  elRDims.innerHTML = "";
  DIMENSIONS.forEach((dimName, d) => {
    const score = dimScores[d];
    const tier = code[d] - 1;
    const tierName = TIER_NAMES[d][tier];
    const row = document.createElement("div");
    row.className = "dim-row";
    row.innerHTML = `
      <div class="top">
        <span class="name">${dimName}</span>
        <span class="val"><em>${tierName}</em> · ${score}/21</span>
      </div>
      <div class="track"><i style="width:0%"></i></div>
    `;
    elRDims.appendChild(row);
    // 下一帧再设宽度，触发动画
    requestAnimationFrame(() => {
      row.querySelector(".track > i").style.width = `${(score/21)*100}%`;
    });
  });

  elRSecondName.textContent = `☆ ${second.p.name}`;
  elRSecondMatch.textContent = `匹配度 ${pct2}%`;
  elRSecondDesc.textContent = second.p.desc;

  elCopyTip.textContent = "";
  showScreen("result");
}

/* ==================== 分享 ==================== */
async function shareResult(){
  if(!lastResult) return;
  const { dimScores, code, best, pct } = lastResult;
  const dimLines = DIMENSIONS.map((d, i) => {
    const t = TIER_NAMES[i][code[i]-1];
    return `· ${d}：${t}（${dimScores[i]}/21）`;
  }).join("\n");

  const text =
`【梦核人格测试 · 我的结果】
主型：${best.p.name}（匹配度 ${pct}%）
代码：${best.p.code}
六维：
${dimLines}

${best.p.desc}

—— 你也来测测你的梦核人格吧。`;

  try{
    await navigator.clipboard.writeText(text);
    flashCopyTip("已复制结果，去粘贴分享吧 ✓");
  }catch(e){
    // 兼容旧浏览器
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); flashCopyTip("已复制结果，去粘贴分享吧 ✓"); }
    catch(_){ flashCopyTip("复制失败，请手动截图分享"); }
    document.body.removeChild(ta);
  }
}
function flashCopyTip(msg){
  elCopyTip.textContent = msg;
  setTimeout(() => { if(elCopyTip.textContent === msg) elCopyTip.textContent = ""; }, 2600);
}

/* ==================== 重置 ==================== */
function restart(){
  state.answers = new Array(QUESTIONS.length).fill(null);
  state.index = 0;
  lastResult = null;
  showScreen("start");
}

/* ==================== 事件绑定 ==================== */
document.getElementById("btn-start").addEventListener("click", () => {
  state.index = 0;
  renderQuestion();
  showScreen("quiz");
});
elPrev.addEventListener("click", goPrev);
elNext.addEventListener("click", goNext);
document.getElementById("btn-restart").addEventListener("click", restart);
document.getElementById("btn-share").addEventListener("click", shareResult);

// 键盘快捷键：A/B/C 选择，← → 翻题
document.addEventListener("keydown", (e) => {
  if(!screens.quiz.classList.contains("active")) return;
  const k = e.key.toLowerCase();
  if(k === "a" || k === "b" || k === "c"){
    const oi = "abc".indexOf(k);
    if(oi < QUESTIONS[state.index].opts.length) selectOption(oi);
  } else if(e.key === "ArrowLeft"){ goPrev(); }
  else if(e.key === "ArrowRight"){ goNext(); }
});

/* ============================================================
   17型图鉴（精简版：仅列表 + 高亮主型）
   ============================================================ */
const codexOverlay = document.getElementById("codex-overlay");
const codexList    = document.getElementById("codex-list");
const btnCodex     = document.getElementById("btn-codex");
const codexClose   = document.getElementById("codex-close");

function renderCodex(highlightCode){
  codexList.innerHTML = "";
  PERSONALITIES.forEach((p, idx) => {
    const isCurrent = highlightCode && p.code === highlightCode;
    const card = document.createElement("article");
    card.className = "codex-card" + (isCurrent ? " is-current" : "");
    card.innerHTML = `
      <img class="codex-avatar" src="Dreamcore Personality Test/${p.code}.png" alt="${p.name}" loading="lazy">
      <div class="codex-card-top">
        <span class="codex-index">${String(idx + 1).padStart(2, "0")}</span>
        <h4>${p.name}</h4>
        ${isCurrent ? '<span class="codex-you">你</span>' : ""}
      </div>
      <div class="codex-code">${p.code}</div>
      <div class="codex-dims">${p.dims}</div>
      <p class="codex-desc">${p.desc}</p>
    `;
    codexList.appendChild(card);
  });
}

function openCodex(){
  const highlight = lastResult ? lastResult.best.p.code : null;
  renderCodex(highlight);
  codexOverlay.classList.add("open");
  codexOverlay.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  if(highlight){
    requestAnimationFrame(() => {
      const cur = codexList.querySelector(".codex-card.is-current");
      if(cur) cur.scrollIntoView({block:"center", behavior:"smooth"});
    });
  }
}

function closeCodex(){
  codexOverlay.classList.remove("open");
  codexOverlay.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}

btnCodex.addEventListener("click", openCodex);
codexClose.addEventListener("click", closeCodex);
codexOverlay.addEventListener("click", (e) => {
  if(e.target === codexOverlay) closeCodex();
});
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape" && codexOverlay.classList.contains("open")) closeCodex();
});

// 初始化：确保开始页显示
showScreen("start");
</script>
